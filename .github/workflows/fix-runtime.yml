name: Fix runtime bridge
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore mobile Laporan Mingguan cards
        shell: bash
        run: |
          bash scripts/fix-laporan-cards.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f scripts/fix-laporan-cards.sh .github/workflows/force-laporan-cards2.yml .github/workflows/force-laporan-cards.yml .github/workflows/one-time-laporan-mobile-fix.yml .trigger-laporan
          git add mobile-only.css scripts/fix-laporan-cards.sh .github/workflows/ .trigger-laporan
          git commit -m 'Restore mobile Laporan Mingguan cards [runtime-fixed]'
          git push
