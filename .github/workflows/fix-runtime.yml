name: Fix runtime bridge

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Supabase bridge, mobile input fix and laporan cards
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          marker = '<!-- SUPABASE_BRIDGE -->'
          inject = '''<!-- SUPABASE_BRIDGE -->\n<script src="./gas-bridge.js?v=20260826-03"></script>\n<script src="./login-direct.js?v=20260826-03"></script>'''

          if './gas-bridge.js?v=20260826-03' not in s:
              if marker not in s:
                  raise SystemExit('Marker SUPABASE_BRIDGE tidak ditemukan')
              s = s.replace(marker, inject, 1)

          # Mobile-only: make Input Laporan > Nama Paket tall enough for 5 lines.
          mp = Path('mobile-only.css')
          if mp.exists():
              ms = mp.read_text(encoding='utf-8')
              ms = ms.replace('min-height:96px!important;height:96px!important', 'min-height:120px!important;height:120px!important')
              mp.write_text(ms, encoding='utf-8')

          # Mobile-only: restore Laporan Mingguan as compact cards.
          card_marker = '/* MOBILE LAPORAN MINGGUAN CARDS 2026-08-26 */'
          card_css = r'''\n/* MOBILE LAPORAN MINGGUAN CARDS 2026-08-26 */\n@media (max-width:760px){\n  #dashboardView #laporanTableSection .table-card{\n    padding:12px !important;\n    border-radius:14px !important;\n    overflow:hidden !important;\n  }\n\n  #dashboardView #laporanTableSection .table-wrap{\n    width:100% !important;\n    overflow:visible !important;\n  }\n\n  #dashboardView #laporanTableSection table{\n    display:block !important;\n    width:100% !important;\n    min-width:0 !important;\n    table-layout:auto !important;\n    border-collapse:separate !important;\n    border-spacing:0 !important;\n  }\n\n  #dashboardView #laporanTableSection thead{\n    display:none !important;\n  }\n\n  #dashboardView #laporanTableSection tbody{\n    display:grid !important;\n    gap:9px !important;\n    width:100% !important;\n  }\n\n  #dashboardView #laporanTableSection tbody tr{\n    display:grid !important;\n    grid-template-columns:minmax(0,1fr) minmax(0,1fr) !important;\n    grid-auto-rows:auto !important;\n    gap:0 !important;\n    width:100% !important;\n    min-width:0 !important;\n    margin:0 !important;\n    padding:9px !important;\n    border:1px solid #d9e4eb !important;\n    border-radius:12px !important;\n    background:#fff !important;\n    box-shadow:0 3px 10px rgba(15,39,58,.06) !important;\n    overflow:hidden !important;\n  }\n\n  #dashboardView #laporanTableSection tbody tr:nth-child(odd) td,\n  #dashboardView #laporanTableSection tbody tr:nth-child(even) td{\n    background:transparent !important;\n  }\n\n  #dashboardView #laporanTableSection tbody td{\n    display:block !important;\n    width:auto !important;\n    min-width:0 !important;\n    max-width:100% !important;\n    margin:0 !important;\n    padding:5px 5px 7px !important;\n    border:0 !important;\n    color:#526b7d !important;\n    font-size:11px !important;\n    font-weight:700 !important;\n    line-height:1.3 !important;\n    white-space:normal !important;\n    overflow-wrap:anywhere !important;\n    word-break:normal !important;\n    vertical-align:top !important;\n  }\n\n  #dashboardView #laporanTableSection tbody td::before{\n    display:block !important;\n    margin:0 0 3px !important;\n    color:#8193a0 !important;\n    font-size:8px !important;\n    line-height:1.1 !important;\n    font-weight:900 !important;\n    letter-spacing:.3px !important;\n    text-transform:uppercase !important;\n  }\n\n  #dashboardView #laporanTableSection tbody td:nth-child(1){grid-column:1 !important;grid-row:1 !important;}\n  #dashboardView #laporanTableSection tbody td:nth-child(2){grid-column:2 !important;grid-row:1 !important;}\n  #dashboardView #laporanTableSection tbody td:nth-child(3){grid-column:1 !important;grid-row:2 !important;}\n  #dashboardView #laporanTableSection tbody td:nth-child(4){grid-column:1 / -1 !important;grid-row:3 !important;padding-top:4px !important;padding-bottom:9px !important;color:#17384d !important;font-size:14px !important;font-weight:900 !important;line-height:1.35 !important;}\n  #dashboardView #laporanTableSection tbody td:nth-child(5){grid-column:1 !important;grid-row:4 !important;}\n  #dashboardView #laporanTableSection tbody td:nth-child(6){grid-column:2 !important;grid-row:4 !important;}\n  #dashboardView #laporanTableSection tbody td:nth-child(7){grid-column:1 !important;grid-row:5 !important;}\n  #dashboardView #laporanTableSection tbody td:nth-child(8){grid-column:2 !important;grid-row:5 !important;}\n  #dashboardView #laporanTableSection tbody td:nth-child(9){grid-column:1 !important;grid-row:6 !important;}\n  #dashboardView #laporanTableSection tbody td:nth-child(10){grid-column:2 !important;grid-row:6 !important;}\n  #dashboardView #laporanTableSection tbody td:nth-child(11){grid-column:1 / -1 !important;grid-row:7 !important;padding-top:4px !important;}\n\n  #dashboardView #laporanTableSection tbody td:nth-child(1)::before{content:'ID Laporan';}\n  #dashboardView #laporanTableSection tbody td:nth-child(2)::before{content:'Tanggal';}\n  #dashboardView #laporanTableSection tbody td:nth-child(3)::before{content:'Kode RUP';}\n  #dashboardView #laporanTableSection tbody td:nth-child(4)::before{content:'Nama Paket';}\n  #dashboardView #laporanTableSection tbody td:nth-child(5)::before{content:'Nama Penyedia';}\n  #dashboardView #laporanTableSection tbody td:nth-child(6)::before{content:'Lokasi';}\n  #dashboardView #laporanTableSection tbody td:nth-child(7)::before{content:'Minggu';}\n  #dashboardView #laporanTableSection tbody td:nth-child(8)::before{content:'Progress';}\n  #dashboardView #laporanTableSection tbody td:nth-child(9)::before{content:'Dibuat Oleh';}\n  #dashboardView #laporanTableSection tbody td:nth-child(10)::before{content:'Status';}\n  #dashboardView #laporanTableSection tbody td:nth-child(11)::before{content:'Keterangan';}\n\n  #dashboardView #laporanTableSection tbody td .status,\n  #dashboardView #laporanTableSection tbody td .progress-pill,\n  #dashboardView #laporanTableSection tbody td .progress-badge{\n    display:inline-flex !important;\n    align-items:center !important;\n    justify-content:center !important;\n    width:auto !important;\n    max-width:100% !important;\n    min-height:22px !important;\n    padding:4px 8px !important;\n    border-radius:999px !important;\n    white-space:normal !important;\n    overflow-wrap:anywhere !important;\n  }\n}\n'''

          if card_marker not in s:
              if '</style>' not in s:
                  raise SystemExit('Penutup style tidak ditemukan')
              s = s.replace('</style>', card_css + '\n</style>', 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html mobile-only.css
          git diff --cached --quiet && exit 0
          git commit -m "Restore mobile laporan cards [runtime-fixed]"
          git push
