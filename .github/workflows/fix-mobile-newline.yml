name: Fix mobile literal newline text
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove accidental literal newline markers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=s
          s=s.replace('\\n/* MOBILE LAPORAN MINGGUAN CARDS 2026-08-26 */\\n', '/* MOBILE LAPORAN MINGGUAN CARDS 2026-08-26 */\n')
          s=s.replace('</style>\\n\\n<!-- PHOTO_COMPRESSION_STATUS_PATCH_V1 -->\\n<script>', '</style>\n\n<!-- PHOTO_COMPRESSION_STATUS_PATCH_V1 -->\n<script>')
          s=s.replace('</script>\\n\\n<!-- PHOTO_COMPRESSION_STATUS_PATCH_V2 -->\\n<script>', '</script>\n\n<!-- PHOTO_COMPRESSION_STATUS_PATCH_V2 -->\n<script>')
          s=s.replace('</script>\\n</body>', '</script>\n</body>')
          if s == old:
              print('No targeted markers found; nothing to commit.')
          else:
              p.write_text(s, encoding='utf-8')
              print('Fixed accidental literal newline markers.')
          PY
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix mobile literal newline text'
          git push
      - name: Remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-mobile-newline.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/fix-mobile-newline.yml
          git commit -m 'Remove temporary mobile fix workflow' || true
          git push || true
