name: Mobile safe fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch mobile only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # The previous mobile patch was committed with a literal backslash
          # at the end of each line. Remove only those escaped line endings
          # inside that patch so normal JS/HTML newlines are restored.
          marker = '<!-- PHOTO_COMPRESSION_STATUS_PATCH_V2 -->'
          start = s.find(marker)
          if start >= 0:
              end = s.find('</script>', start)
              if end >= 0:
                  end += len('</script>')
                  section = s[start:end]
                  section = section.replace('\\\\\\r\\n', '\\r\\n')
                  section = section.replace('\\\\\\n', '\\n')
                  s = s[:start] + section + s[end:]

          fast_marker = '<!-- MOBILE_DASHBOARD_FAST_STATS_V1 -->'
          if fast_marker not in s:
              patch = r'''<!-- MOBILE_DASHBOARD_FAST_STATS_V1 -->
<script>
(function(){
  function mobile(){ return window.matchMedia('(max-width:760px)').matches; }
  function num(v){
    var raw=String(v==null?'':v).trim();
    if(!raw) return 0;
    raw=raw.replace(/[^0-9,.-]/g,'');
    if(raw.indexOf(',')>=0 && raw.indexOf('.')>=0){
      raw=raw.replace(/\./g,'').replace(',','.');
    } else if(raw.indexOf('.')>=0){
      var parts=raw.split('.');
      if(parts.length>1 && parts.every(function(x){return x.length===3 || /^-?\d+$/.test(x);})){ raw=parts.join(''); }
    } else { raw=raw.replace(',','.'); }
    var n=parseFloat(raw);
    return Number.isFinite(n)?n:0;
  }
  function money(n){
    return 'Rp ' + Math.round(n).toLocaleString('id-ID');
  }
  function update(){
    if(!mobile() || !Array.isArray(window.masterProyek) || !window.masterProyek.length) return;
    var list=window.masterProyek;
    var total=list.length, nilai=0, running=0, done=0, prog=0;
    list.forEach(function(x){
      nilai += num(x.totalNilai);
      var p=num(x.progres);
      prog += p;
      var st=String(x.status||'').toUpperCase();
      if(p>=100 || st.indexOf('SELESAI')>=0 || st.indexOf('SELESAI')>=0) done++;
      else if(p>0 || st.indexOf('BERJALAN')>=0 || st.indexOf('PROSES')>=0) running++;
    });
    var avg=total ? prog/total : 0;
    var a=document.getElementById('pimpinanTotalProyek'); if(a) a.textContent=total;
    a=document.getElementById('pimpinanTotalNilai'); if(a) a.textContent=money(nilai);
    a=document.getElementById('pimpinanBerjalan'); if(a) a.textContent=running;
    a=document.getElementById('pimpinanSelesai'); if(a) a.textContent=done;
    a=document.getElementById('pimpinanRataProgres'); if(a) a.textContent=(Math.round(avg*100)/100)+'%';
  }
  function install(){
    if(typeof window.loadPimpinanDashboard!=='function' || window.__mobileFastStatsInstalled) return;
    window.__mobileFastStatsInstalled=true;
    var original=window.loadPimpinanDashboard;
    window.loadPimpinanDashboard=function(){
      var panel=document.getElementById('monitoringProyekPanel');
      var panelVisible=panel && getComputedStyle(panel).display!=='none';
      if(mobile() && !panelVisible){
        update();
        return;
      }
      return original.apply(this,arguments);
    };
    update();
  }
  document.addEventListener('DOMContentLoaded',function(){
    install();
    setTimeout(install,100);
    setTimeout(install,500);
    setTimeout(install,1500);
    setTimeout(update,2200);
  });
  window.addEventListener('resize',function(){ if(mobile()) update(); });
})();
</script>
'''
              s = s.replace('</body>', patch + '</body>')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Fix mobile escaped patch and dashboard stats speed'
          git push
