name: Fix mobile duplicate Laporan Mingguan

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !startsWith(github.event.head_commit.message, 'Fix mobile duplicate Laporan Mingguan') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Keep Laporan Mingguan menu-only on mobile
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '''      document
        .getElementById('inputLaporanSection')
        .style.display =
        (isPimpinan || isAdmin) ? 'none' : 'block';

      document
        .getElementById('laporanTableSection')
        .style.display =
        (isPimpinan || isAdmin) ? 'none' : 'block';'''

          new = '''      /*
        Mobile: modul Input Laporan dan Laporan Mingguan
        hanya tampil ketika menu-nya dipilih.
        Desktop mempertahankan perilaku lama; setelah
        setupRoleCommandCenter() modul akan mengikuti menu aktif.
      */
      const mobileOnlyMenuLayout =
        window.matchMedia('(max-width:760px)').matches;

      document
        .getElementById('inputLaporanSection')
        .style.display =
        mobileOnlyMenuLayout
          ? 'none'
          : ((isPimpinan || isAdmin) ? 'none' : 'block');

      document
        .getElementById('laporanTableSection')
        .style.display =
        mobileOnlyMenuLayout
          ? 'none'
          : ((isPimpinan || isAdmin) ? 'none' : 'block');'''

          if old not in s:
              raise SystemExit('Target block not found; no changes made.')

          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix mobile duplicate Laporan Mingguan'
          git push
