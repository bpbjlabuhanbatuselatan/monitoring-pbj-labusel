name: Repair frontend bridge

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject Supabase bridge
        env:
          BRIDGE_B64: PCEtLSBTVVBBQkFTRV9CUklER0UgLS0+CjxzY3JpcHQ+CihmdW5jdGlvbigpewogIGNvbnN0IEVORFBPSU5UPTgnaHR0cHM6Ly9tc2ZrcHc5d3Fy cGJtZ2R0bGJ3ZG8uc3VwYWJhc2UuY28vZnVuY3Rpb25zL3YxL2dhcy1hcGknOwo gIGZ1bmN0aW9uIHJ1bm5lcihzdGF0ZSl7CiAgICByZXR1cm4gbmV3IFByb3h5KHt9LCB7Z2V0KF8sIHByb3ApewogICAgICBpZihwcm9wPT09J3dpdGhTdWNjZXNzSGFuZGxlcicpIHJldHVybiBmbj0+cnVubmVyKHsuLi5zdGF0ZSxz dWNjZXNzOmZufSk7CiAgICAgIGlmKHByb3A9PT0nd2l0aEZhaWx1cmVIYW5kbGVyJykgcmV0dXJuIGZuPT5ydW5uZXIoe y4uLnN0YXRlLGZhaWx1cmU6Zm59KTsKICAgICAgcmV0dXJuICguLi5hcmdzKT0+ewogICAgICAgIGZldGNoKEVORFBPSU5QLHttZXRob2Q6J1BPU1QnLGhlYWRlcnM6eydDb250ZW50LVR5cGUnOidhcHBsaWNhdGlvbi9qc29uJyx9LGJvZHk6SlNPTi5zdHJpbmdpZnkoe2Z1bmN0aW9uOlN0cmluZyh wcm9wKSxhcmdzfSl9KQogICAgICAgICAgLnRoZW4oYXN5bmMg cj0+e2NvbnN0IGQ9YXdhaXQgci5qc29uKCk7aWYoIXIub2spIHRocm93IG5ldyBFcnJvc 
        run: |
          python3 -c "from pathlib import Path; import os,base64; p=Path('index.html'); s=p.read_text(encoding='utf-8'); b=base64.b64decode(os.environ['BRIDGE_B64']).decode(); p.write_text(s if '<!-- SUPABASE_BRIDGE -->' in s else s.replace('<script>',b+'<script>',1),encoding='utf-8')"
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: connect github frontend to supabase'
          git push
