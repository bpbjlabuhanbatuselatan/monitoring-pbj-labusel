name: Repair frontend bridge

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    if: github.event.head_commit.message != 'fix: connect github frontend to supabase'
    steps:
      - uses: actions/checkout@v4
      - name: Inject Supabase compatibility bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- SUPABASE_BRIDGE -->'
          if marker in s:
              raise SystemExit('bridge already present')
          bridge=r'''<!-- SUPABASE_BRIDGE -->
<script>
(function(){
  const ENDPOINT='https://msfkpwwqrpbmgdtlbwdo.supabase.co/functions/v1/gas-api';
  function runner(state){
    return new Proxy({}, {get(_, prop){
      if(prop==='withSuccessHandler') return fn=>runner({...state,success:fn});
      if(prop==='withFailureHandler') return fn=>runner({...state,failure:fn});
      return (...args)=>{
        fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({function:String(prop),args})})
          .then(async r=>{const d=await r.json();if(!r.ok) throw new Error(d.message||'Server error');return d;})
          .then(d=>{if(state.success) state.success(d);})
          .catch(e=>{if(state.failure) state.failure({message:e.message||String(e)});});
      };
    }});
  }
  window.google=window.google||{};
  window.google.script=window.google.script||{};
  window.google.script.run=runner({});
})();
</script>
'''
          pos=s.find('<script>')
          if pos<0: raise SystemExit('script tag not found')
          s=s[:pos]+bridge+s[pos:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: connect github frontend to supabase' || exit 0
          git push
