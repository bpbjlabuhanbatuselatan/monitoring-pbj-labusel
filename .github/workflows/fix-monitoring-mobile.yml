name: Fix mobile Monitoring Proyek

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'Apply mobile Monitoring Proyek card CSS') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<style id="monitoringMobileCardFinal">'
          if marker in s:
              print('Patch already present')
              raise SystemExit(0)

          css = r'''<style id="monitoringMobileCardFinal">
          @media (max-width:760px){
            /* ==========================================================
               MONITORING SELURUH PROYEK — MOBILE CARD FINAL
               Desktop tidak disentuh.
               ========================================================== */
            #dashboardView #monitoringProyekPanel{
              width:100%!important;
              max-width:100%!important;
              min-width:0!important;
              box-sizing:border-box!important;
              overflow:hidden!important;
            }
            #dashboardView #monitoringProyekPanel .pimpinan-table-wrap{
              width:100%!important;
              max-width:100%!important;
              min-width:0!important;
              overflow:visible!important;
            }
            #dashboardView #monitoringProyekPanel .pimpinan-table{
              display:block!important;
              width:100%!important;
              max-width:100%!important;
              min-width:0!important;
              table-layout:auto!important;
              border:0!important;
              border-collapse:separate!important;
              border-spacing:0!important;
            }
            #dashboardView #monitoringProyekPanel .pimpinan-table thead{
              display:none!important;
            }
            #dashboardView #monitoringProyekPanel .pimpinan-table tbody{
              display:grid!important;
              width:100%!important;
              max-width:100%!important;
              min-width:0!important;
              gap:10px!important;
              margin:0!important;
              padding:0!important;
            }
            #dashboardView #monitoringProyekPanel .pimpinan-table tbody tr{
              display:grid!important;
              grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;
              grid-auto-rows:auto!important;
              width:100%!important;
              max-width:100%!important;
              min-width:0!important;
              margin:0!important;
              padding:11px!important;
              box-sizing:border-box!important;
              background:#fff!important;
              border:1px solid #dce6ec!important;
              border-radius:13px!important;
              box-shadow:0 3px 11px rgba(15,23,42,.055)!important;
              overflow:hidden!important;
            }
            #dashboardView #monitoringProyekPanel .pimpinan-table tbody td{
              display:block!important;
              position:static!important;
              width:auto!important;
              max-width:100%!important;
              min-width:0!important;
              height:auto!important;
              min-height:0!important;
              margin:0!important;
              padding:5px!important;
              box-sizing:border-box!important;
              border:0!important;
              background:transparent!important;
              color:#526575!important;
              font-family:Arial,Helvetica,sans-serif!important;
              font-size:11px!important;
              font-weight:700!important;
              line-height:1.32!important;
              white-space:normal!important;
              overflow:visible!important;
              overflow-wrap:anywhere!important;
              word-break:normal!important;
              vertical-align:top!important;
            }
            #dashboardView #monitoringProyekPanel .pimpinan-table tbody td::before{
              display:block!important;
              width:100%!important;
              margin:0 0 3px!important;
              color:#8193a0!important;
              font-size:8px!important;
              line-height:1.15!important;
              font-weight:900!important;
              letter-spacing:.35px!important;
              text-transform:uppercase!important;
            }
            #dashboardView #monitoringProyekPanel .pimpinan-table tbody td:nth-child(1)::before{content:'Kode RUP';}
            #dashboardView #monitoringProyekPanel .pimpinan-table tbody td:nth-child(2)::before{content:'Nama Paket';}
            #dashboardView #monitoringProyekPanel .pimpinan-table tbody td:nth-child(3)::before{content:'Total Nilai';}
            #dashboardView #monitoringProyekPanel .pimpinan-table tbody td:nth-child(4)::before{content:'Progress';}
            #dashboardView #monitoringProyekPanel .pimpinan-table tbody td:nth-child(5)::before{content:'Minggu';}
            #dashboardView #monitoringProyekPanel .pimpinan-table tbody td:nth-child(6)::before{content:'Status';}
            #dashboardView #monitoringProyekPanel .pimpinan-table tbody td:nth-child(7)::before{content:'Laporan Terakhir';}
            #dashboardView #monitoringProyekPanel .pimpinan-table tbody td:nth-child(8)::before{content:none!important;display:none!important;}

            /* Top: Kode RUP + Aksi */
            #dashboardView #monitoringProyekPanel .pimpinan-table tbody td:nth-child(1){
              grid-column:1!important;grid-row:1!important;
            }
            #dashboardView #monitoringProyekPanel .pimpinan-table tbody td:nth-child(8){
              grid-column:2!important;grid-row:1!important;
              text-align:right!important;
              width:auto!important;
              padding:0 0 2px 8px!important;
              align-self:start!important;
            }

            /* Package name gets the full card width. */
            #dashboardView #monitoringProyekPanel .pimpinan-table tbody td:nth-child(2){
              grid-column:1 / -1!important;
              grid-row:2!important;
              width:100%!important;
              max-width:none!important;
              min-width:0!important;
              padding:5px 5px 8px!important;
              color:#17384d!important;
              font-size:14px!important;
              font-weight:900!important;
              line-height:1.32!important;
              white-space:normal!important;
              overflow:visible!important;
              overflow-wrap:break-word!important;
              word-break:normal!important;
            }
            #dashboardView #monitoringProyekPanel .pimpinan-table tbody td:nth-child(2) *{
              width:auto!important;
              max-width:100%!important;
              min-width:0!important;
              white-space:normal!important;
              overflow:visible!important;
              overflow-wrap:break-word!important;
              word-break:normal!important;
            }

            /* Middle details: 2 columns. */
            #dashboardView #monitoringProyekPanel .pimpinan-table tbody td:nth-child(3){grid-column:1!important;grid-row:3!important;}
            #dashboardView #monitoringProyekPanel .pimpinan-table tbody td:nth-child(4){grid-column:2!important;grid-row:3!important;}
            #dashboardView #monitoringProyekPanel .pimpinan-table tbody td:nth-child(5){grid-column:1!important;grid-row:4!important;}
            #dashboardView #monitoringProyekPanel .pimpinan-table tbody td:nth-child(6){grid-column:2!important;grid-row:4!important;}
            #dashboardView #monitoringProyekPanel .pimpinan-table tbody td:nth-child(7){grid-column:1 / -1!important;grid-row:5!important;}

            #dashboardView #monitoringProyekPanel .pimpinan-table tbody td:nth-child(1)>*,
            #dashboardView #monitoringProyekPanel .pimpinan-table tbody td:nth-child(3)>*,
            #dashboardView #monitoringProyekPanel .pimpinan-table tbody td:nth-child(5)>*,
            #dashboardView #monitoringProyekPanel .pimpinan-table tbody td:nth-child(6)>*,
            #dashboardView #monitoringProyekPanel .pimpinan-table tbody td:nth-child(7)>*{
              display:block!important;
              width:auto!important;
              max-width:100%!important;
              min-width:0!important;
              font-size:inherit!important;
              line-height:inherit!important;
              white-space:normal!important;
              overflow-wrap:anywhere!important;
              word-break:normal!important;
            }

            #dashboardView #monitoringProyekPanel .pimpinan-table tbody td:nth-child(4) .progress-pill,
            #dashboardView #monitoringProyekPanel .pimpinan-table tbody td:nth-child(4) .progress-badge{
              display:inline-flex!important;
              align-items:center!important;
              justify-content:center!important;
              width:auto!important;
              min-width:40px!important;
              min-height:23px!important;
              padding:4px 8px!important;
              border-radius:8px!important;
              background:#d7ecff!important;
              color:#111827!important;
              font-weight:900!important;
            }

            #dashboardView #monitoringProyekPanel .pimpinan-table tbody td:nth-child(8) .pimpinan-action-btn,
            #dashboardView #monitoringProyekPanel .pimpinan-table tbody td:nth-child(8) button{
              display:inline-flex!important;
              align-items:center!important;
              justify-content:center!important;
              width:auto!important;
              min-width:72px!important;
              max-width:110px!important;
              min-height:30px!important;
              margin:0!important;
              padding:6px 8px!important;
              border-radius:8px!important;
              background:#0f3852!important;
              background-image:none!important;
              color:#fff!important;
              border:1px solid #0b2f45!important;
              box-shadow:none!important;
              font-size:10px!important;
              font-weight:900!important;
              line-height:1.1!important;
              white-space:normal!important;
              overflow:visible!important;
              text-align:center!important;
            }
          }
          </style>'''

          s = s.replace('</head>', css + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Apply mobile Monitoring Proyek card CSS'
          git push
