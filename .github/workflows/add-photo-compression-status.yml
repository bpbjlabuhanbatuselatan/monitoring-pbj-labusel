name: Add safe mobile photo compression status

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/add-photo-compression-status.yml'

permissions:
  contents: write

jobs:
  patch-photo-compression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add non-invasive photo compression status
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'PHOTO_COMPRESSION_STATUS_PATCH_V2'
          if marker in s:
              print('Patch already present; nothing to do.')
              raise SystemExit(0)

          patch = r'''\n<!-- PHOTO_COMPRESSION_STATUS_PATCH_V2 -->\n<script>\n(function(){\n  function fmt(bytes){\n    if (!Number.isFinite(bytes)) return '-';\n    if (bytes >= 1024*1024) return (bytes/(1024*1024)).toFixed(2) + ' MB';\n    return Math.max(1, Math.round(bytes/1024)) + ' KB';\n  }\n  function estimate(file){\n    return new Promise(function(resolve){\n      var r = new FileReader();\n      r.onerror = function(){ resolve(null); };\n      r.onload = function(e){\n        var img = new Image();\n        img.onerror = function(){ resolve(null); };\n        img.onload = function(){\n          try {\n            var w=img.width,h=img.height,max=1600;\n            if(w>max||h>max){\n              if(w>h){h=Math.round(h*max/w);w=max;}\n              else{w=Math.round(w*max/h);h=max;}\n            }\n            var c=document.createElement('canvas'); c.width=w; c.height=h;\n            c.getContext('2d').drawImage(img,0,0,w,h);\n            var data=c.toDataURL('image/jpeg',0.78);\n            var size=Math.max(0,Math.floor((data.length-data.indexOf(',')-1)*3/4));\n            resolve(size);\n          } catch(err){ resolve(null); }\n        };\n        img.src=e.target.result;\n      };\n      r.readAsDataURL(file);\n    });\n  }\n  function attach(){\n    var inputs=document.querySelectorAll('input[type="file"]');\n    inputs.forEach(function(input){\n      if(input.dataset.photoCompressionStatusAttached) return;\n      if(input.accept && input.accept.indexOf('image')===-1) return;\n      input.dataset.photoCompressionStatusAttached='1';\n      input.addEventListener('change', async function(){\n        var files=Array.from(input.files||[]);\n        if(!files.length) return;\n        var box=document.getElementById('photoCompressionStatus');\n        if(!box){\n          box=document.createElement('div'); box.id='photoCompressionStatus';\n          box.style.marginTop='8px'; box.style.padding='8px 10px';\n          box.style.borderRadius='9px'; box.style.background='#f8fafc';\n          box.style.border='1px solid #eaecf0'; box.style.color='#475467';\n          box.style.fontSize='11px'; box.style.fontWeight='800';\n          var anchor=document.getElementById('photoPreview')||document.getElementById('photoCount');\n          if(anchor&&anchor.parentNode) anchor.parentNode.insertBefore(box,anchor);\n        }\n        box.textContent='Menghitung ukuran hasil kompres...';\n        var totalOriginal=0,totalCompressed=0,count=0;\n        for(const file of files.slice(0,5)){\n          totalOriginal += file.size;\n          var size=await estimate(file);\n          if(size){totalCompressed+=size;count++;}\n        }\n        if(count){\n          box.textContent='Kompres foto: '+fmt(totalOriginal)+' → ±'+fmt(totalCompressed)+' ✓';\n        } else {\n          box.textContent='Foto siap diproses saat disimpan.';\n        }\n      });\n    });\n  }\n  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',attach); else attach();\n  new MutationObserver(attach).observe(document.documentElement,{childList:true,subtree:true});\n})();\n</script>\n'''
          s = s.replace('</body>', patch + '</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Add non-invasive photo compression status'
          git push
