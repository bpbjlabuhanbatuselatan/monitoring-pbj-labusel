name: Add safe mobile photo compression status

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/add-photo-compression-status.yml'

permissions:
  contents: write

jobs:
  patch-photo-compression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add photo compression status patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'PHOTO_COMPRESSION_STATUS_PATCH_V1'
          if marker in s:
              print('Patch already present; nothing to do.')
              raise SystemExit(0)

          patch = r'''\n<!-- PHOTO_COMPRESSION_STATUS_PATCH_V1 -->\n<script>\n(function(){\n  function fmt(bytes){\n    if (!Number.isFinite(bytes)) return '-';\n    if (bytes >= 1024*1024) return (bytes/(1024*1024)).toFixed(2) + ' MB';\n    return Math.max(1, Math.round(bytes/1024)) + ' KB';\n  }\n\n  function showStatus(file, compressed){\n    var box = document.getElementById('photoCompressionStatus');\n    if (!box) {\n      box = document.createElement('div');\n      box.id = 'photoCompressionStatus';\n      box.style.marginTop = '8px';\n      box.style.padding = '8px 10px';\n      box.style.borderRadius = '9px';\n      box.style.background = '#f8fafc';\n      box.style.border = '1px solid #eaecf0';\n      box.style.color = '#475467';\n      box.style.fontSize = '11px';\n      box.style.fontWeight = '800';\n      var anchor = document.getElementById('photoPreview') || document.getElementById('photoCount');\n      if (anchor && anchor.parentNode) anchor.parentNode.insertBefore(box, anchor);\n    }\n    box.textContent = 'Kompres foto: ' + fmt(file.size) + ' → ' + fmt(compressed.size) + ' ✓';\n  }\n\n  window.kompresFoto = function(file){\n    return new Promise(function(resolve){\n      var reader = new FileReader();\n      var done = false;\n      function fallback(){\n        if (done) return;\n        done = true;\n        showStatus(file, file);\n        resolve({name:file.name, data:null, originalFile:file});\n      }\n      reader.onerror = fallback;\n      reader.onload = function(e){\n        var img = new Image();\n        img.onerror = fallback;\n        img.onload = function(){\n          try {\n            var w = img.width, h = img.height, max = 1600;\n            if (w > max || h > max) {\n              if (w > h) { h = Math.round(h*max/w); w = max; }\n              else { w = Math.round(w*max/h); h = max; }\n            }\n            var canvas = document.createElement('canvas');\n            canvas.width = w; canvas.height = h;\n            var ctx = canvas.getContext('2d');\n            ctx.drawImage(img,0,0,w,h);\n            var data = canvas.toDataURL('image/jpeg',0.78);\n            var bytes = Math.max(0, Math.floor((data.length - data.indexOf(',') - 1) * 3 / 4));\n            var compressed = {name:file.name.replace(/\\.[^.]+$/, '') + '.jpg', size:bytes, data:data};\n            done = true;\n            showStatus(file, compressed);\n            resolve(compressed);\n          } catch(e) { fallback(); }\n        };\n        img.src = e.target.result;\n      };\n      reader.readAsDataURL(file);\n    });\n  };\n})();\n</script>\n'''
          s = s.replace('</body>', patch + '</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Add mobile photo compression status'
          git push
