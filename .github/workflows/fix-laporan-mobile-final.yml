name: Final mobile Laporan Mingguan fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[laporan-mobile-final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch only mobile Laporan Mingguan visibility
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* MOBILE LAPORAN VISIBILITY FINAL */'
          if marker in s:
              print('Patch already present')
              raise SystemExit(0)

          css = '''\n<style id="laporanMobileVisibilityFinal">\n/* MOBILE LAPORAN VISIBILITY FINAL */\n@media (max-width:760px){\n  /* On mobile, Laporan Mingguan is a menu-only screen.\n     Never let older !important card CSS resurrect it elsewhere. */\n  #dashboardView[data-mobile-menu]:not([data-mobile-menu="laporan"]) #laporanTableSection{\n    display:none!important;\n  }\n\n  /* When the Laporan Mingguan menu is selected, keep the existing\n     card/table styling exactly as-is. Only visibility is controlled here. */\n  #dashboardView[data-mobile-menu="laporan"] #laporanTableSection{\n    display:block!important;\n  }\n}\n</style>\n'''

          if '</head>' not in s:
              raise SystemExit('head closing tag not found')
          s = s.replace('</head>', css + '</head>', 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/fix-laporan-mobile-final.yml
          git commit -m 'Fix mobile Laporan Mingguan visibility [laporan-mobile-final]'
          git push
