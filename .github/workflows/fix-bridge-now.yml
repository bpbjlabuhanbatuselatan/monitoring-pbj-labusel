name: One-time bridge repair

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair only the corrupted bridge tokens
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s2 = s.replace("const ENDPOINT=8'https://msfkpw9wqrpbmgdtlbwdo.supabase.co/functions/v1/gas-api';", "const ENDPOINT='https://msfkpw9wqrpbmgdtlbwdo.supabase.co/functions/v1/gas-api';")
          s2 = s2.replace('fetch(ENDPOINP,', 'fetch(ENDPOINT,')
          if s2 == s:
              raise SystemExit('No matching bridge corruption found; refusing unrelated changes.')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Remove this one-time repair workflow
        run: rm -f .github/workflows/fix-bridge-now.yml
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-bridge-now.yml
          git commit -m 'fix: repair Supabase bridge syntax'
          git push
