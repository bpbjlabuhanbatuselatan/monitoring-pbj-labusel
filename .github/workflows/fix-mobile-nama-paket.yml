name: Fix Mobile Nama Paket

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix: mobile nama paket font'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply tiny mobile-only font fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* MOBILE NAMA PAKET FONT FIX */'
          if marker not in s:
              css = '''\n\n/* MOBILE NAMA PAKET FONT FIX */\n@media (max-width:760px){\n  #laporanNamaPaket{\n    font-size:17px !important;\n  }\n}\n'''
              pos = s.rfind('</style>')
              if pos == -1:
                  raise SystemExit('Penutup </style> tidak ditemukan')
              s = s[:pos] + css + s[pos:]
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit only the tiny CSS change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: mobile nama paket font'
          git push

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-mobile-nama-paket.yml
          git commit -m 'chore: remove temporary mobile fix workflow'
          git push
