name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          rm -rf site
          mkdir site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'site' ./ site/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('site/index.html')
          s = p.read_text(encoding='utf-8')
          bridge = Path('site/gas-bridge.js').read_text(encoding='utf-8')
          guard = Path('site/dashboard-stats-guard.js').read_text(encoding='utf-8')
          mobile = '<link rel="stylesheet" href="mobile-only.css?v=20260826-06">'
          fallback = '<script src="login-direct.js?v=20260826-01"></script>'
          inline_bridge = '<script>\n' + bridge + '\n</script>'
          inline_guard = '<script>\n' + guard + '\n</script>'
          mobile_patch = r'''<style id="finalMobileLaporanPatch">
          @media (max-width:760px){
            #dashboardView #laporanTableSection,
            #dashboardView #laporanTableSection .table-card{
              width:calc(100% - 16px)!important;
              max-width:none!important;
              min-width:0!important;
              margin-left:8px!important;
              margin-right:8px!important;
              padding:12px!important;
              overflow:hidden!important;
              box-sizing:border-box!important;
            }
            #dashboardView #laporanTableSection .table-wrap{
              width:100%!important;
              max-width:100%!important;
              overflow:visible!important;
            }
            #dashboardView #laporanTableSection table{
              display:block!important;
              width:100%!important;
              min-width:0!important;
              max-width:100%!important;
              table-layout:auto!important;
              border-collapse:separate!important;
              border-spacing:0!important;
            }
            #dashboardView #laporanTableSection thead{display:none!important;}
            #dashboardView #laporanTableSection tbody{
              display:grid!important;
              grid-template-columns:1fr!important;
              gap:10px!important;
              width:100%!important;
              margin:0!important;
              padding:0!important;
            }
            #dashboardView #laporanTableSection tbody tr{
              display:grid!important;
              grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;
              grid-auto-rows:auto!important;
              width:100%!important;
              min-width:0!important;
              max-width:100%!important;
              margin:0!important;
              padding:10px!important;
              border:1px solid #d9e4eb!important;
              border-radius:13px!important;
              background:#fff!important;
              box-shadow:0 3px 10px rgba(15,39,58,.06)!important;
              overflow:hidden!important;
              box-sizing:border-box!important;
            }
            #dashboardView #laporanTableSection tbody td{
              display:block!important;
              width:auto!important;
              min-width:0!important;
              max-width:100%!important;
              height:auto!important;
              margin:0!important;
              padding:5px!important;
              border:0!important;
              background:transparent!important;
              color:#526575!important;
              font-size:11px!important;
              font-weight:700!important;
              line-height:1.3!important;
              white-space:normal!important;
              overflow:visible!important;
              overflow-wrap:anywhere!important;
              word-break:normal!important;
              box-sizing:border-box!important;
            }
            #dashboardView #laporanTableSection tbody td::before{
              display:block!important;
              margin:0 0 3px!important;
              color:#8193a0!important;
              font-size:8px!important;
              line-height:1.1!important;
              font-weight:900!important;
              letter-spacing:.3px!important;
              text-transform:uppercase!important;
            }
            #dashboardView #laporanTableSection tbody td:nth-child(1){grid-column:1!important;grid-row:1!important;}
            #dashboardView #laporanTableSection tbody td:nth-child(2){grid-column:2!important;grid-row:1!important;}
            #dashboardView #laporanTableSection tbody td:nth-child(3){grid-column:1!important;grid-row:2!important;}
            #dashboardView #laporanTableSection tbody td:nth-child(7){grid-column:2!important;grid-row:2!important;}
            #dashboardView #laporanTableSection tbody td:nth-child(4){grid-column:1/-1!important;grid-row:3!important;padding-top:6px!important;padding-bottom:9px!important;color:#17384d!important;font-size:14px!important;font-weight:900!important;line-height:1.35!important;overflow-wrap:break-word!important;}
            #dashboardView #laporanTableSection tbody td:nth-child(5){grid-column:1!important;grid-row:4!important;}
            #dashboardView #laporanTableSection tbody td:nth-child(6){grid-column:2!important;grid-row:4!important;}
            #dashboardView #laporanTableSection tbody td:nth-child(8){grid-column:1!important;grid-row:5!important;}
            #dashboardView #laporanTableSection tbody td:nth-child(10){grid-column:2!important;grid-row:5!important;}
            #dashboardView #laporanTableSection tbody td:nth-child(9){grid-column:1/-1!important;grid-row:6!important;}
            #dashboardView #laporanTableSection tbody td:nth-child(11){grid-column:1/-1!important;grid-row:7!important;color:#667085!important;font-size:10px!important;}
            #dashboardView #laporanTableSection tbody td:nth-child(1)::before{content:'ID Laporan';}
            #dashboardView #laporanTableSection tbody td:nth-child(2)::before{content:'Tanggal';}
            #dashboardView #laporanTableSection tbody td:nth-child(3)::before{content:'Kode RUP';}
            #dashboardView #laporanTableSection tbody td:nth-child(4)::before{content:'Nama Paket';}
            #dashboardView #laporanTableSection tbody td:nth-child(5)::before{content:'Nama Penyedia';}
            #dashboardView #laporanTableSection tbody td:nth-child(6)::before{content:'Lokasi';}
            #dashboardView #laporanTableSection tbody td:nth-child(7)::before{content:'Minggu';}
            #dashboardView #laporanTableSection tbody td:nth-child(8)::before{content:'Progress';}
            #dashboardView #laporanTableSection tbody td:nth-child(9)::before{content:'Dibuat Oleh';}
            #dashboardView #laporanTableSection tbody td:nth-child(10)::before{content:'Status';}
            #dashboardView #laporanTableSection tbody td:nth-child(11)::before{content:'Keterangan';}
            #dashboardView #laporanTableSection tbody td:nth-child(8) *{
              display:inline-flex!important;
              align-items:center!important;
              justify-content:center!important;
              width:auto!important;
              min-width:38px!important;
              padding:4px 8px!important;
              border-radius:8px!important;
              background:#d7ecff!important;
              color:#111827!important;
              font-weight:900!important;
              white-space:nowrap!important;
            }
            #dashboardView #laporanTableSection tbody td:nth-child(10) .status{
              display:inline-flex!important;
              align-items:center!important;
              justify-content:center!important;
              width:auto!important;
              max-width:100%!important;
              padding:4px 8px!important;
              border-radius:999px!important;
              white-space:normal!important;
              font-size:9px!important;
            }
          }
          </style>'''
          if 'mobile-only.css' not in s:
              s = s.replace('</head>', mobile + '\n</head>', 1)
          else:
              import re
              s = re.sub(r'<link rel="stylesheet" href="mobile-only\.css\?v=[^"]*">', mobile, s, count=1)
          if 'finalMobileLaporanPatch' not in s:
              s = s.replace('</head>', mobile_patch + '\n</head>', 1)
          if 'window.__supabaseBridge' not in s:
              s = s.replace('</head>', inline_bridge + '\n</head>', 1)
          if 'dashboardStatsGuard' not in s:
              s = s.replace('</head>', inline_guard + '\n</head>', 1)
          if 'login-direct.js' not in s:
              s = s.replace('</head>', fallback + '\n</head>', 1)
          s = s.replace('<script src="gas-bridge.js?v=20260826-stable"></script>', '')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
