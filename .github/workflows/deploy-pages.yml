name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        shell: bash
        run: |
          rm -rf site
          mkdir site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'site' ./ site/
          python3 - <<'PY'
          from pathlib import Path

          p = Path('site/index.html')
          s = p.read_text(encoding='utf-8')
          bridge = '<script src="gas-bridge.js?v=20260825-2350"></script>'

          if 'gas-bridge.js' not in s:
              if '</body>' in s:
                  s = s.replace('</body>', bridge + '\n</body>', 1)
              else:
                  s += '\n' + bridge

          p.write_text(s, encoding='utf-8')
          PY

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
