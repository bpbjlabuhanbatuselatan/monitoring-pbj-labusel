name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          rm -rf site
          mkdir site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'site' ./ site/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('site/index.html')
          s = p.read_text(encoding='utf-8')
          # Keep the stable bridge exactly as-is; only add isolated mobile CSS.
          bridge = '\n<script src="gas-bridge.js?v=20260826-stable"></script>\n'
          mobile = '\n<link rel="stylesheet" href="mobile-only.css?v=20260826-01">\n'
          if 'gas-bridge.js' not in s:
              s = s.replace('</body>', bridge + '</body>', 1) if '</body>' in s else s + bridge
          if 'mobile-only.css' not in s:
              s = s.replace('</head>', mobile + '</head>', 1) if '</head>' in s else mobile + s
          p.write_text(s, encoding='utf-8')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
