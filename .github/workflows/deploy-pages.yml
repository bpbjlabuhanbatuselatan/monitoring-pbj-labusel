name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          rm -rf site
          mkdir site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'site' ./ site/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('site/index.html')
          s = p.read_text(encoding='utf-8')
          bridge = Path('site/gas-bridge.js').read_text(encoding='utf-8')
          mobile = '<link rel="stylesheet" href="mobile-only.css?v=20260826-05">'
          fallback = '<script src="login-direct.js?v=20260826-01"></script>'
          inline_bridge = '<script>\n' + bridge + '\n</script>'
          if 'mobile-only.css' not in s:
              s = s.replace('</head>', mobile + '\n</head>', 1)
          else:
              import re
              s = re.sub(r'<link rel="stylesheet" href="mobile-only\.css\?v=[^"]*">', mobile, s, count=1)
          if 'window.__supabaseBridge' not in s:
              s = s.replace('</head>', inline_bridge + '\n</head>', 1)
          if 'login-direct.js' not in s:
              s = s.replace('</head>', fallback + '\n</head>', 1)
          s = s.replace('<script src="gas-bridge.js?v=20260826-stable"></script>', '')
          p.write_text(s, encoding='utf-8')

          # Mobile-only: make the Input Laporan Nama Paket text smaller.
          mp = Path('site/mobile-only.css')
          ms = mp.read_text(encoding='utf-8')
          marker = '/* MOBILE INPUT LAPORAN NAMA PAKET FONT ONLY */'
          if marker not in ms:
              ms += '''\n\n/* MOBILE INPUT LAPORAN NAMA PAKET FONT ONLY */\n@media (max-width:760px){\n  #dashboardView #inputLaporanSection #laporanNamaPaket{\n    font-size:12px !important;\n    line-height:1.25 !important;\n  }\n}\n'''
              mp.write_text(ms, encoding='utf-8')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
