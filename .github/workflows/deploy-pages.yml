name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        shell: bash
        run: |
          rm -rf site
          mkdir site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'site' ./ site/
          python3 - <<'PY'
          from pathlib import Path

          p = Path('site/index.html')
          s = p.read_text(encoding='utf-8')

          bridge = '<script src="gas-bridge.js?v=20260825-2350"></script>'
          mobile = r'''
          <style id="mobile-responsive-fix">
          html,body{width:100%;max-width:100%;overflow-x:hidden}
          img{max-width:100%}

          @media (max-width:620px){
            .home{min-height:100dvh;padding:22px 12px;align-items:flex-start}
            .home-inner{max-width:100%;padding-top:18px}
            .logos{gap:8px;margin-bottom:20px}
            .logo-box{width:72px;height:72px;padding:7px;border-radius:14px}
            .main-title{font-size:clamp(27px,8.4vw,38px);line-height:1.02;letter-spacing:-.8px}
            .main-subtitle{margin:12px auto 20px;font-size:12px;line-height:1.4}
            .home-buttons{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:9px}
            .btn-primary,.btn-secondary{min-width:0;width:100%;padding:13px 10px}
            .footer{margin-top:20px;font-size:10px}

            .dashboard{padding:8px}
            .dashboard-inner{max-width:100%}
            .topbar{padding:11px 12px;border-radius:13px;gap:10px;align-items:stretch;flex-wrap:wrap}
            .brand{min-width:0;width:100%}
            .brand-logo{width:42px;height:42px}
            .brand-title{font-size:13px;line-height:1.25;white-space:normal}
            .brand-role{font-size:10px}
            .top-actions{width:100%;justify-content:flex-end;flex-wrap:wrap}
            .notification-button{padding:8px 10px;font-size:10px}
            .btn-logout{padding:9px 12px;font-size:11px}

            .welcome{margin-bottom:12px;padding:0 2px}
            .welcome h1{font-size:24px;line-height:1.12}
            .welcome p{font-size:12px;line-height:1.4}

            .stats{grid-template-columns:1fr;gap:9px;margin-bottom:11px}
            .stat-card{padding:13px;border-radius:13px}
            .stat-value{font-size:24px}

            .report-card,.table-card{padding:13px;border-radius:13px;margin-bottom:11px}
            .report-header{align-items:stretch;flex-wrap:wrap;margin-bottom:11px}
            .report-title,.table-title{font-size:17px;line-height:1.2}
            .report-header .save-btn,.save-btn{width:100%;padding:11px 13px}
            .report-grid{grid-template-columns:1fr;gap:10px}
            .full{grid-column:auto}

            .field{margin-bottom:10px}
            .field label{font-size:11px;margin-bottom:5px}
            .field input,.field select,.field textarea{padding:11px 10px;font-size:13px}

            .week-info{align-items:flex-start;flex-direction:column;font-size:11px;gap:4px}
            .week-number{font-size:17px}

            .adendum-box{grid-column:auto;padding:11px}
            .adendum-box.show{grid-template-columns:1fr;gap:9px}
            .adendum-title{grid-column:auto}

            .photo-preview{grid-template-columns:repeat(3,1fr);gap:6px}
            .photo-item{height:78px}

            .verify-card{padding:12px}
            .verify-top{flex-direction:column;gap:7px}
            .verify-package{font-size:13px;line-height:1.35}
            .verify-meta{font-size:11px}
            .verify-actions{flex-wrap:wrap}
            .btn-verify{flex:1;min-width:120px}

            .table-wrap,.admin-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
            table{min-width:900px}
            .admin-list{padding:13px;border-radius:13px}
            .admin-list-header{align-items:flex-start;flex-wrap:wrap}
            .admin-list-title{font-size:17px}
            .admin-stats{grid-template-columns:1fr 1fr;gap:8px}
            .admin-stat{padding:12px;border-radius:12px}
            .admin-stat-value{font-size:19px}
            .admin-table{min-width:760px}

            .modal{padding:8px}
            .modal-card{max-width:100%;max-height:94dvh;padding:17px;border-radius:15px}
            .modal-title{font-size:20px;margin-bottom:15px}
            .modal-buttons{flex-direction:column}
            .modal-buttons button{width:100%}
          }

          @media (max-width:380px){
            .home-buttons{grid-template-columns:1fr}
            .logos{gap:6px}
            .logo-box{width:66px;height:66px}
            .main-title{font-size:26px}
            .dashboard{padding:6px}
            .topbar{padding:10px}
            .admin-stats{grid-template-columns:1fr}
            .photo-preview{grid-template-columns:repeat(2,1fr)}
          }
          </style>
          '''

          if 'id="mobile-responsive-fix"' not in s:
              s = s.replace('</head>', mobile + '\n</head>', 1)

          if 'gas-bridge.js' not in s:
              if '</body>' in s:
                  s = s.replace('</body>', bridge + '\n</body>', 1)
              else:
                  s += '\n' + bridge

          p.write_text(s, encoding='utf-8')
          PY

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
