name: Fix Mobile Layout

on:
  push:
    paths:
      - '.github/workflows/fix-mobile-layout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch mobile CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          marker = '/* MOBILE FIX 2026-08-26 */'
          if marker not in s:
              patch = r'''
          /* MOBILE FIX 2026-08-26 */
          @media (max-width: 979px), (pointer: coarse) and (max-width: 1100px){
            html, body{
              width:100% !important;
              min-width:0 !important;
              max-width:100% !important;
              overflow-x:hidden !important;
            }

            #dashboardView,
            #dashboardView .dashboard,
            #dashboardView .dashboard-inner{
              width:100% !important;
              max-width:100% !important;
              min-width:0 !important;
              margin:0 !important;
              padding-left:0 !important;
              padding-right:0 !important;
              overflow-x:hidden !important;
            }

            #dashboardView .dashboard{
              display:flex !important;
              flex-direction:column !important;
              gap:12px !important;
            }

            #dashboardView .dashboard-inner{
              display:contents !important;
            }

            #dashboardView .topbar{
              order:1 !important;
              width:calc(100% - 16px) !important;
              margin:8px 8px 0 !important;
            }

            #dashboardView .role-sidebar{
              order:2 !important;
              display:block !important;
              position:relative !important;
              top:auto !important;
              left:auto !important;
              width:calc(100% - 16px) !important;
              min-width:0 !important;
              max-width:none !important;
              min-height:0 !important;
              height:auto !important;
              margin:0 8px !important;
              grid-column:auto !important;
              grid-row:auto !important;
            }

            #dashboardView .role-sidebar-nav{
              display:grid !important;
              grid-template-columns:repeat(2,minmax(0,1fr)) !important;
              gap:7px !important;
            }

            #dashboardView .role-nav-item{
              min-width:0 !important;
              width:100% !important;
              white-space:normal !important;
              font-size:12px !important;
              padding:9px 7px !important;
            }

            #dashboardView .welcome,
            #dashboardView .stats,
            #dashboardView #adminSection,
            #dashboardView #adminReportSection,
            #dashboardView #logAktivitasSection,
            #dashboardView #adminPendaftaranSection,
            #dashboardView #pimpinanSection,
            #dashboardView #inputLaporanSection,
            #dashboardView #verifikasiSection,
            #dashboardView #laporanTableSection{
              order:3 !important;
              grid-column:auto !important;
              grid-row:auto !important;
              width:calc(100% - 16px) !important;
              min-width:0 !important;
              max-width:none !important;
              margin-left:8px !important;
              margin-right:8px !important;
            }

            #dashboardView .stats{
              grid-template-columns:repeat(2,minmax(0,1fr)) !important;
              gap:8px !important;
            }

            #dashboardView .stat-card{
              min-width:0 !important;
              padding:11px !important;
            }

            #dashboardView #laporanTableSection,
            #dashboardView #laporanTableSection .table-card,
            #dashboardView #laporanTableSection table{
              width:100% !important;
              max-width:100% !important;
              min-width:0 !important;
            }

            #dashboardView #laporanTableSection{
              overflow-x:hidden !important;
            }

            #dashboardView #laporanTableSection table{
              table-layout:fixed !important;
            }

            #dashboardView #laporanTableSection th,
            #dashboardView #laporanTableSection td{
              white-space:normal !important;
              overflow-wrap:anywhere !important;
              word-break:normal !important;
            }
          }
          '''
              s = s.replace('</style>', patch + '\n  </style>', 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit mobile patch and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-mobile-layout.yml
          git commit -m 'Fix mobile dashboard width and stacking' || exit 0
          git push
          git rm .github/workflows/fix-mobile-layout.yml
          git commit -m 'Remove temporary mobile fix workflow'
          git push
