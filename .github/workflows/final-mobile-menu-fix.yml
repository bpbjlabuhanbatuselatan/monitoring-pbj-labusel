name: Final mobile menu visibility fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[mobile-menu-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Hide Input/Laporan on mobile unless the corresponding menu is active.
          marker = '''      document.querySelectorAll(\n        '.role-nav-item'\n      ).forEach(function(btn){'''
          replacement = '''      const mobileMenuHost = document.getElementById('dashboardView');\n      if (mobileMenuHost) {\n        mobileMenuHost.setAttribute('data-mobile-menu', key);\n      }\n\n      document.querySelectorAll(\n        '.role-nav-item'\n      ).forEach(function(btn){'''
          if 'data-mobile-menu' not in s and marker in s:
              s = s.replace(marker, replacement, 1)

          css = '''\n<style id="mobile-menu-section-guard">\n@media (max-width:760px){\n  #dashboardView #inputLaporanSection,\n  #dashboardView #laporanTableSection{display:none!important}\n  #dashboardView[data-mobile-menu="input"] #inputLaporanSection{display:block!important}\n  #dashboardView[data-mobile-menu="laporan"] #laporanTableSection{display:block!important}\n}\n</style>\n'''
          if 'id="mobile-menu-section-guard"' not in s:
              s = s.replace('</head>', css + '</head>', 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix mobile menu sections [mobile-menu-fixed]'
          git push
