name: Fix mobile HTML artifacts

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !startsWith(github.event.head_commit.message, 'Fix mobile HTML artifacts') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean accidental literal newline markers
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = s

          s = s.replace('\\n/* MOBILE LAPORAN MINGGUAN CARDS 2026-08-26 */\\n', '/* MOBILE LAPORAN MINGGUAN CARDS 2026-08-26 */\n')
          s = s.replace('</style>\\n\\n<!-- PHOTO_COMPRESSION_STATUS_PATCH_V1 -->\\n<script>', '</style>\n\n<!-- PHOTO_COMPRESSION_STATUS_PATCH_V1 -->\n<script>')
          s = s.replace('</script>\\n\\n<!-- PHOTO_COMPRESSION_STATUS_PATCH_V2 -->\\n<script>', '</script>\n\n<!-- PHOTO_COMPRESSION_STATUS_PATCH_V2 -->\n<script>')
          s = s.replace('</script>\\n</body>', '</script>\n</body>')

          if s != old:
              p.write_text(s, encoding='utf-8')
              print('HTML artifacts cleaned.')
          else:
              print('No matching artifacts found.')
          PY

      - name: Remove temporary cleanup workflow files
        run: |
          rm -f .github/workflows/fix-mobile-newline.yml TEMP_TRIGGER.txt

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-mobile-newline.yml TEMP_TRIGGER.txt
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Fix mobile HTML artifacts'
          git push
