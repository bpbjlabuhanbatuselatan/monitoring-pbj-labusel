name: Fix package font mobile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix: mobile package font only'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply tiny mobile-only font rule
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('mobile-only.css')
          s = p.read_text(encoding='utf-8')
          marker = '/* MOBILE INPUT LAPORAN NAMA PAKET FONT ONLY */'
          if marker not in s:
              s += '''\n\n/* MOBILE INPUT LAPORAN NAMA PAKET FONT ONLY */\n@media (max-width:760px){\n  #dashboardView #inputLaporanSection #laporanNamaPaket{\n    font-size:12px !important;\n    line-height:1.25 !important;\n  }\n}\n'''
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit font fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile-only.css
          git diff --cached --quiet && exit 0
          git commit -m 'fix: mobile package font only'
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-package-font-mobile.yml
          git commit -m 'chore: remove temporary package font workflow'
          git push
