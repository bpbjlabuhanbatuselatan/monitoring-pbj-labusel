<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitoring Progres Pekerjaan Fisik</title>
</head>
<body>
  <div id="loader" style="font-family:Arial,sans-serif;padding:40px;text-align:center">Memuat aplikasi...</div>
  <script>
  (async function(){
    try {
      const url='https://raw.githubusercontent.com/bpbjlabuhanbatuselatan/monitoring-pbj-labusel/7ea4890287c778b4e5260e29f8b449c7e5d4dbe4/index.html';
      const r=await fetch(url,{cache:'no-store'});
      if(!r.ok) throw new Error('Gagal mengambil index asli.');
      let html=await r.text();
      const bridge='<script src="https://raw.githubusercontent.com/bpbjlabuhanbatuselatan/monitoring-pbj-labusel/main/supabase-bridge.js?v=20260825-2125"><\\/script>';
      html=html.replace(/<\\/body>/i,bridge+'<\\/body>');
      document.open();document.write(html);document.close();
    } catch(e) {
      document.getElementById('loader').textContent='Aplikasi gagal dimuat: '+e.message;
    }
  })();
  </script>
</body>
</html>
